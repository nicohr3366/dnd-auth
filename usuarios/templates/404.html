{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página No Encontrada | Portal D&D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'usuarios/css/style.css' %}">
    <style>
        .error-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: var(--gold-dim);
            line-height: 1;
            text-shadow: 0 0 40px rgba(212,175,55,0.2);
            letter-spacing: 8px;
        }
        .error-dragon {
            font-size: 5rem;
            display: block;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 20px rgba(212,175,55,0.3));
        }
        .error-title {
            color: var(--parchment);
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 1rem 0;
        }
        .error-subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            max-width: 380px;
            margin: 0 auto 2rem;
            line-height: 1.7;
        }
        .error-divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            margin: 1.5rem auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/usuarios/">&#9876;&#65039; PORTAL D&amp;D</a>
    </div>
</nav>

<div class="dnd-container error-page">
    <div>
        <span class="error-dragon">&#129409;</span>
        <div class="error-code">404</div>
        <div class="error-divider"></div>
        <h1 class="error-title">Página no encontrada</h1>
        <p class="error-subtitle">
            El pergamino que buscas no existe en este reino.<br>
            Quizás fue destruido por un dragón, o nunca existió.
        </p>
        <a href="/usuarios/" class="btn-dnd-primary">&#8592; Volver al Portal</a>
    </div>
</div>

<footer class="dnd-footer">
    &#9876;&#65039; &nbsp; Portal D&amp;D — Gestión de Aventureros &nbsp; &#9876;&#65039;
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
