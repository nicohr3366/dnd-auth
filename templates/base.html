{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal D&D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #0f0f1a;
            border-bottom: 1px solid #d4af37;
        }
        .navbar-brand {
            color: #d4af37 !important;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .container {
            background-color: rgba(0,0,0,0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .table-dark {
            background-color: #1e1e2f;
            border-radius: 10px;
        }
        .btn-dnd-primary {
            background-color: #d4af37;
            border: none;
            color: #1a1a2e;
            font-weight: bold;
        }
        .btn-dnd-primary:hover {
            background-color: #c59b27;
            color: #000;
        }
        .dnd-footer {
            text-align: center;
            margin-top: 40px;
            padding: 15px;
            border-top: 1px solid #d4af37;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">
            <!-- ✅ CORREGIDO: ahora usa el namespace 'usuarios' -->
            <a class="navbar-brand" href="{% url 'usuarios:usuario_listar' %}">⚔️ PORTAL D&amp;D</a>
            <div class="ms-auto">
                {% if user.is_authenticated %}
                    <span class="text-light me-3">Bienvenido, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="dnd-footer">
        🐉 Portal D&amp;D — Gestión de Aventureros — Todos los derechos reservados
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
