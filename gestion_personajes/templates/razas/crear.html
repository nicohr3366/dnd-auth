{% extends "razas/base.html" %}
{% block page_title %}Crear Raza{% endblock %}

{% block content %}
<div class="dnd-card mt-4 form-page">
    <div class="action-bar" style="margin-bottom:1.5rem;">
        <h1 class="dnd-title mb-0">&#127758; Crear Nueva Raza</h1>
        <a href="{% url 'gestion_personajes:lista_razas' %}" class="btn-dnd-secondary">&#8592; Ver Razas</a>
    </div>

    <form method="POST" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nombre de la Raza</label>
            <input type="text" class="form-control" name="nombre" placeholder="Ej: Elfo, Enano, Orco..." required maxlength="80">
            <div class="form-text">Máximo 80 caracteres</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="4"
                placeholder="Describe las características, historia y cultura de esta raza..."></textarea>
            <div class="form-text">Opcional</div>
        </div>

        <hr class="dnd-sep">
        <p style="color:#8b7536; font-family:'Cinzel',serif; font-size:0.82rem; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:1rem;">
            &#10022; Bonos de Atributos
        </p>
        <p style="color:#9a8060; font-size:0.85rem; margin-bottom:1rem;">Asigna bonos a los atributos principales (deja en 0 para sin bonos)</p>

        <div class="stats-grid">
            <div class="stat-input-group">
                <label class="form-label">Fuerza</label>
                <input type="number" class="form-control" name="bono_fuerza" value="0" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Destreza</label>
                <input type="number" class="form-control" name="bono_destreza" value="0" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Constitución</label>
                <input type="number" class="form-control" name="bono_constitucion" value="0" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Inteligencia</label>
                <input type="number" class="form-control" name="bono_inteligencia" value="0" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Sabiduría</label>
                <input type="number" class="form-control" name="bono_sabiduria" value="0" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Carisma</label>
                <input type="number" class="form-control" name="bono_carisma" value="0" min="-10" max="10">
            </div>
        </div>

        <hr class="dnd-sep">
        <div class="form-actions">
            <button type="submit" class="btn-dnd-primary">Crear Raza</button>
            <a href="{% url 'gestion_personajes:lista_razas' %}" class="btn-dnd-secondary">&#8592; Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
