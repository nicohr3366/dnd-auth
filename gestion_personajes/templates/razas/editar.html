{% extends "razas/base.html" %}
{% block page_title %}Editar Raza{% endblock %}

{% block content %}
<div class="dnd-card mt-4 form-page">
    <div class="action-bar" style="margin-bottom:1.5rem;">
        <h1 class="dnd-title mb-0">&#9998; Editar Raza: <span style="color:#d4af37;">{{ raza.nombre }}</span></h1>
        <a href="{% url 'gestion_personajes:lista_razas' %}" class="btn-dnd-secondary">&#8592; Ver Razas</a>
    </div>

    <form method="POST" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nombre de la Raza</label>
            <input type="text" class="form-control" name="nombre" value="{{ raza.nombre }}" required maxlength="80">
            <div class="form-text">Máximo 80 caracteres</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="4"
                placeholder="Describe las características, historia y cultura de esta raza...">{{ raza.descripcion }}</textarea>
            <div class="form-text">Opcional</div>
        </div>

        <hr class="dnd-sep">
        <p style="color:#8b7536; font-family:'Cinzel',serif; font-size:0.82rem; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:1rem;">
            &#10022; Bonos de Atributos
        </p>

        <div class="stats-grid">
            <div class="stat-input-group">
                <label class="form-label">Fuerza</label>
                <input type="number" class="form-control" name="bono_fuerza" value="{{ raza.bono_fuerza }}" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Destreza</label>
                <input type="number" class="form-control" name="bono_destreza" value="{{ raza.bono_destreza }}" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Constitución</label>
                <input type="number" class="form-control" name="bono_constitucion" value="{{ raza.bono_constitucion }}" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Inteligencia</label>
                <input type="number" class="form-control" name="bono_inteligencia" value="{{ raza.bono_inteligencia }}" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Sabiduría</label>
                <input type="number" class="form-control" name="bono_sabiduria" value="{{ raza.bono_sabiduria }}" min="-10" max="10">
            </div>
            <div class="stat-input-group">
                <label class="form-label">Carisma</label>
                <input type="number" class="form-control" name="bono_carisma" value="{{ raza.bono_carisma }}" min="-10" max="10">
            </div>
        </div>

        <hr class="dnd-sep">
        <div class="form-actions">
            <button type="submit" class="btn-dnd-primary">Guardar Cambios</button>
            <a href="{% url 'gestion_personajes:lista_razas' %}" class="btn-dnd-secondary">&#8592; Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
