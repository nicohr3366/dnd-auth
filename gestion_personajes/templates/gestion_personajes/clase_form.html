{% extends 'gestion_personajes/base.html' %}

{% block content %}
<section class="panel">
  <h2>{{ title }}</h2>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      {{ form.as_p }}
    </div>
    <div class="form-actions">
      <button class="btn btn-success" type="submit">Guardar Clase</button>
      <a class="btn btn-neutral" href="{% url 'gestion_personajes:clase_list' %}">Volver</a>
    </div>
  </form>
</section>
{% endblock %}
