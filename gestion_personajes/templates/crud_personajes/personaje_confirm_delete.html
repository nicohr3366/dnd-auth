{% extends 'gestion_personajes/base.html' %}
{% block page_title %}Eliminar Personaje{% endblock %}

{% block content %}
<div class="dnd-card mt-4 form-page">
    <h1 class="dnd-title">&#10005; Confirmar eliminación</h1>
    <div class="delete-box">
        <div class="entity-name">{{ personaje.nombre }}</div>
        <p style="color:#9a8060; font-size:0.9rem; margin:0.25rem 0 0;">Esta acción no se puede deshacer.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn-dnd-danger">&#10005; Sí, eliminar</button>
            <a href="{% url 'gestion_personajes:personaje_list' %}" class="btn-dnd-secondary">&#8592; Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
